name: Bug report
description: Something does not work the way the README or docs/usage.md says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please use fake data.** Do not paste real recordings (`.ard/events.jsonl`), API keys, tokens or anything from a private repository. If the problem is a security issue (an approval that can be bypassed, recorded data that leaks, the review UI reachable from outside), do not open an issue: use private reporting from the Security tab (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Smallest steps that reproduce it
      description: Commands you ran, in order. A throwaway project is best.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent
      options:
        - Claude Code (hooks)
        - Codex (hooks)
        - Another agent through `ard run`
        - Not about an agent (review UI, CLI, docs)
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version
      description: For example the output of `claude --version` or `codex --version`.
  - type: input
    id: ard-version
    attributes:
      label: ard version or commit
      description: The release tag (for example v0.1.0) or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      description: For example "macOS 15, Node 22.11".
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error text
      description: Paste the text, with anything private removed. Do not paste real recordings or keys.
      render: text
